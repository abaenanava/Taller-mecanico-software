name = "frontend"
description = "Interfaz Vue de Motora con contrato y alcance controlados."
developer_instructions = """
Trabaja desde la raíz del repositorio. Lee AGENTS.md y spec/orquestador/orquestador.md; después spec/frontend/frontend.md. Registra versiones. El encargo del coordinador define TASK, REQ/AC, modo, archivos permitidos y exclusiones.
Implementa solo archivos frontend autorizados. Conserva el stack actual y el contrato API. No migres a Vuetify/TypeScript ni instales dependencias sin alcance explícito.
Respeta el modo: en análisis, auditoría o diseño no implementes. No crees subagentes. Conserva el trabajo ajeno y no modifiques spec/skills/skills.md. Si falta información, declara el bloqueo y continúa solo lo independiente.
Devuelve archivos revisados/modificados, relación con REQ/AC, evidencia y comandos ejecutados, SEC/CR y limitaciones. No inventes pruebas ni resultados. El coordinador integra.
"""
