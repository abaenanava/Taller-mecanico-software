services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-motora}
      MYSQL_USER: ${MYSQL_USER:-motora_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-motora_password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-motora_root_password}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD:-motora_root_password}"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-motora}
      MYSQL_USER: ${MYSQL_USER:-motora_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-motora_password}
      MYSQL_HOST: db
      MYSQL_PORT: 3306
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-development-only-change-me}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-False}
      DJANGO_COOKIE_SECURE: ${DJANGO_COOKIE_SECURE:-False}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,backend}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-http://localhost:5173}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
      SEED_RECEPTION_PASSWORD: ${SEED_RECEPTION_PASSWORD:-}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - media_data:/app/media
      - ./database:/app/database:ro
      - ./database/seeds:/app/database/seeds:ro

  frontend:
    image: node:24-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
      - frontend_modules:/app/node_modules
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    depends_on:
      - backend
    ports:
      - "5173:5173"

volumes:
  mysql_data:
  frontend_modules:
  media_data:
